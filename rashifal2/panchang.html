<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दैनिक पंचांग - Advanced Panchang</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="panchangdata.js"></script> 
    <!-- डाउनलोड फंक्शन फाइल -->
    <script src="download-button.js"></script>
    <style>
        
        .panchang-header-box {
            background: linear-gradient(135deg, #8b0000, #b22222);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .panchang-header-box h2 {
            margin: 5px 0;
            font-size: 28px;
        }
        .sub-info {
            font-size: 18px;
            opacity: 0.9;
        }
        .highlight-card {
            background: #fff8e1 !important;
            border: 2px dashed #fbc02d !important;
        }
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="capture-area" style="background: #f4f7f6; padding: 25px; border-radius: 20px; max-width: 1200px; margin: auto;">
        
        <!-- एडवांस हेडर -->
        <div class="panchang-header-box">
            <span style="font-size: 22px;">🕉️ सनातन दैनिक पंचांग 🕉️</span>
            <h2 id="current-date-heading">तारीख लोड हो रही है...</h2>
            <div class="sub-info" id="sambat-info">विक्रम संवत</div>
        </div>
        
        <div id="panchang-container" class="grid-container">
            <!-- डेटा यहाँ जावास्क्रिप्ट द्वारा लोड होगा -->
        </div>
        <!-- फुटर (ज्योतिषाचार्य की जानकारी) -->
        <div class="image-footer">
            <p>📌 सटीक फलादेश और परामर्श के लिए संपर्क सूत्र:</p>
            <p class="footer-content">
                <span class="astrologer-info">👤 ज्योतिषाचार्य नीरज गोयल (शामली)</span>
                <span class="phone-box">📞 9758007088</span>
            </p>
        </div>
    </div>
<script>
    function loadPanchang(targetDateStr = null) {
        const container = document.getElementById('panchang-container');
        const dateHeading = document.getElementById('current-date-heading');
        const sambatInfo = document.getElementById('sambat-info');
        
        container.innerHTML = '';

        // यदि कोई तारीख नहीं दी गई है, तो सिस्टम की आज की तारीख लें (YYYY-MM-DD फॉर्मेट में)
        let dateToFetch = targetDateStr;
        if (!dateToFetch) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            dateToFetch = `${year}-${month}-${day}`;
        }

        // तारीख को हिंदी फॉर्मेट में दिखाने के लिए
        const dateObj = new Date(dateToFetch);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        
        if (!isNaN(dateObj)) {
            dateHeading.innerText = dateObj.toLocaleDateString('hi-IN', options);
        } else {
            dateHeading.innerText = "अमान्य तारीख";
        }

        const data = panchangData[dateToFetch];

        // यदि उस तारीख का डेटा उपलब्ध नहीं है
        if (!data) {
            sambatInfo.innerText = "उपलब्ध नहीं";
            container.innerHTML = `<h2 style='text-align:center; color: #d9534f; grid-column: span 3; padding: 40px;'>माफ़ कीजिए, ${dateToFetch} तारीख के लिए पंचांग डेटा उपलब्ध नहीं है।</h2>`;
            return;
        }

        // यदि डेटा उपलब्ध है तो संवत और अन्य जानकारी दिखाएं
        sambatInfo.innerText = `${data.vikramSambat || ''} | ${data.ayan || ''} | ${data.ritu || ''}`;

        // 12 कार्ड्स की सूची (यहाँ बुधवार के लिए चेक लगा दिया गया है ताकि अभिजीत मुहूर्त स्वतः वर्जित हो जाए)
        const items = [
            { title: "तिथि", icon: "🌙", desc: data.tithi },
            { title: "नक्षत्र", icon: "✨", desc: data.nakshatra },
            { title: "योग", icon: "🧘‍♂️", desc: data.yog },
            { title: "करण", icon: "⚡", desc: data.karan },
            { title: "सूर्य व चन्द्र गोचर", icon: "🪐", desc: `सूर्य: ${data.sunSign} | चन्द्रमा: ${data.moonSign}` },
            { title: "सूर्योदय / सूर्यास्त", icon: "🌅", desc: `सूर्योदय: ${data.sunrise} | सूर्यास्त: ${data.sunset}` },
            { title: "अभिजीत मुहूर्त (शुभ)", icon: "⏰", desc: (data.day === 'बुधवार') ? "वर्जित (बुधवार को मान्य नहीं)" : data.abhijitMuhurat, isHighlight: true },
            { title: "राहुकाल (अशुभ)", icon: "⚠️", desc: data.rahukaal, isHighlight: true },
            { title: "दिशा शूल", icon: "🧭", desc: `आज दिशा शूल: ${data.dishaShool} दिशा में रहेगा।` },
            { title: "आज का विशेष उपाय", icon: "🪔", desc: data.remedy },
            { title: "नक्षत्र फल / विशेष", icon: "🌟", desc: data.nakshatraphal },
            { title: "विशेष विवरण", icon: "💡", desc: data.special }
        ];

        items.forEach((item) => {
            const card = document.createElement('div');
            card.className = item.isHighlight ? 'card highlight-card' : 'card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="rashi-icon">${item.icon}</span>
                    <h3>${item.title}</h3>
                </div>
                <ul class="analysis-list">
                    <li>${item.desc || 'उपलब्ध नहीं'}</li>
                </ul>
            `;
            container.appendChild(card);
        });
    }

    window.addEventListener('load', function() {
        loadPanchang(); // पेज लोड होने पर आज की तारीख का डेटा दिखाएगा
        addDownloadButton('capture-area', 'advanced-panchang.png');
    });
</script>    
</body>
</html>
