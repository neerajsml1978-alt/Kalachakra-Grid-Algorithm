<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राशिफल विशेष उपाय - ज्योतिषाचार्य नीरज गोयल</title>
    
    <!-- आपकी स्टाइलशीट फाइल -->
    <link rel="stylesheet" href="style.css">
    
    <!-- इमेज डाउनलोड करने के लिए लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- उपाय का डेटा देने वाली फाइल -->
    <script src="upay.js"></script>
    
    <!-- डाउनलोड बटन फंक्शन फाइल -->
    <script src="download-button.js"></script>
</head>
<body>

    <!-- यह पूरा एरिया इमेज के रूप में डाउनलोड होगा -->
    <div id="capture-area">
        
        <!-- मुख्य शीर्षक (तारीख अपने आप अपडेट होगी) -->
        <h1 class="main-title">
            ✨ विशेष ज्योतिषीय उपाय - <span id="current-date"></span>
        </h1>
        
        <!-- मेष से लेकर मीन तक के 12 कार्ड यहाँ अपने आप आएंगे -->
        <div id="rashifal-container" class="grid-container"></div>

        <!-- फुटर (ज्योतिषाचार्य की जानकारी) -->
        <div class="image-footer">
            <p>📌 सटीक फलादेश और परामर्श के लिए संपर्क सूत्र:</p>
            <p class="footer-content">
                <span class="astrologer-info">👤 ज्योतिषाचार्य नीरज गोयल (शामली)</span>
                <span class="phone-box">📞 9758007088</span>
            </p>
        </div>

    </div>

    <!-- करंट डेटा उठाकर 12 कार्ड भरने की स्क्रिप्ट (सीधे यहीं लिखी है) -->
    <script>
        window.onload = function() {
            // 1. आज की तारीख पता करना (जैसे 2026-08-20 या आपके डेटा के हिसाब से फॉर्मेट)
            // यह कोड आपके upay.js के डेटा से आज की या सबसे नजदीकी तारीख का डेटा मैच करेगा
            if (typeof allData !== 'undefined') {
                // तारीख निकालने का लॉजिक (आपकी जरूरत के हिसाब से)
                const dateKeys = Object.keys(allData);
                
                // फिलहाल हम यहाँ आखिरी या आज की तारीख का डेटा ले रहे हैं 
                // (या आप चाहें तो यहाँ सीधी अपनी तारीख डाल सकते हैं जैसे "2026-08-20-06-00")
                let todayKey = dateKeys[dateKeys.length - 1]; // डिफ़ॉल्ट रूप से लेटेस्ट डेटा ले रहा है
                
                // तारीख दिखाने के लिए
                document.getElementById('current-date').innerText = todayKey.split('-').slice(0, 3).join('-');

                const rashifalList = allData[todayKey];
                const container = document.getElementById('rashifal-container');
                container.innerHTML = '';

                if (rashifalList) {
                    rashifalList.forEach(item => {
                        let card = document.createElement('div');
                        card.className = 'card'; // style2.css की कार्ड क्लास
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="card-icon">${item.icon}</span>
                                <h3 class="card-title">${item.rashi}</h3>
                            </div>
                            <p class="card-msg">${item.msg}</p>
                        `;
                        container.appendChild(card);
                    });
                }
            } else {
                console.error("upay.js फाइल सही से लोड नहीं हुई है!");
            }
            
            // 2. डाउनलोड बटन एक्टिवेट करना
            if (typeof addDownloadButton === 'function') {
                addDownloadButton('capture-area', 'upay_rashifal.png');
            }
        };
    </script>

</body>
</html>
