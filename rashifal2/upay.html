<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>राशिफल विशेष उपाय - ज्योतिषाचार्य नीरज गोयल</title>
    
    <!-- आपकी स्टाइलशीट फाइल -->
    <link rel="stylesheet" href="style.css">
    
    <!-- इमेज डाउनलोड करने के लिए लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- उपाय का डेटा देने वाली फाइल -->
    <script src="upay.js"></script>
    
    <!-- डाउनलोड बटन फंक्शन फाइल -->
    <script src="download-button.js"></script>
</head>
<body>

    <!-- यह पूरा एरिया इमेज के रूप में डाउनलोड होगा -->
    <div id="capture-area">
        
        <!-- मुख्य शीर्षक (तारीख अपने आप अपडेट होगी) -->
        <h1 class="main-title">
            ✨ विशेष ज्योतिषीय उपाय - <span id="current-date"></span>
        </h1>
        
        <!-- मेष से लेकर मीन तक के 12 कार्ड 3-कॉलम वाले ग्रिड में यहाँ आएंगे -->
        <div id="rashifal-container" class="grid-container"></div>

        <!-- फुटर (ज्योतिषाचार्य की जानकारी) -->
        <div class="image-footer">
            <p>📌 सटीक फलादेश और परामर्श के लिए संपर्क सूत्र:</p>
            <p class="footer-content">
                <span class="astrologer-info">👤 ज्योतिषाचार्य नीरज गोयल (शामली)</span>
                <span class="phone-box">📞 9758007088</span>
            </p>
        </div>

    </div>

    <!-- करंट डेटा उठाकर 12 कार्ड भरने की स्क्रिप्ट -->
    <!-- करंट डेटा उठाकर 12 कार्ड भरने की स्क्रिप्ट -->
    <script>
        window.onload = function() {
            if (typeof allData !== 'undefined') {
                
                // 1. आज की असली करंट तारीख निकालना (YYYY-MM-DD फॉर्मेट)
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const todayStr = `${year}-${month}-${day}`;
                
                let matchedKey = null;
                
                for (const dateKey in allData) {
                    if (dateKey.startsWith(todayStr)) {
                        matchedKey = dateKey;
                        break;
                    }
                }
                
                if (!matchedKey) {
                    const dateKeys = Object.keys(allData);
                    matchedKey = dateKeys[dateKeys.length - 1];
                }
                
                document.getElementById('current-date').innerText = matchedKey.split('-').slice(0, 3).join('-');

                // 2. डेटा निकालकर कार्ड भरना
                const rashifalList = allData[matchedKey];
                const container = document.getElementById('rashifal-container');
                container.innerHTML = '';

                if (rashifalList) {
                    rashifalList.forEach(item => {
                        let card = document.createElement('div');
                        card.className = 'card';
                        
                        // --- यहाँ बदलाव किया गया है ---
                        // यह कोड उपाय के मैसेज को पूर्णविराम (।) के आधार पर अलग-अलग लाइनों (बुलेट पॉइंट्स) में तोड़ देगा
                        let sentences = item.msg.split('।').filter(s => s.trim() !== '');
                        let listHtml = '';
                        sentences.forEach(sentence => {
                            listHtml += `<li>${sentence.trim()}।</li>`;
                        });
                        
                        card.innerHTML = `
                            <div class="card-header">
                                <span class="rashi-icon">${item.icon}</span>
                                <h3 class="card-title">${item.rashi}</h3>
                            </div>
                            <ul class="analysis-list">
                                ${listHtml}
                            </ul>
                        `;
                        container.appendChild(card);
                    });
                }
            } else {
                console.error("upay.js फाइल सही से लोड नहीं हुई है!");
            }
            
            if (typeof addDownloadButton === 'function') {
                addDownloadButton('capture-area', 'upay_rashifal.png');
            }
        };
    </script>
</body>
</html>
