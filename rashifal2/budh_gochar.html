<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बुध ग्रह का गोचर फल</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- html2canvas लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- 1. बुध गोचर की डेटा फाइल -->
    <script src="budh.js"></script>
    
    <!-- 2. डाउनलोड बटन वाली फाइल -->
    <script src="download-button.js"></script>
</head>
<body>

<div id="capture-area">
    <h1 style="text-align: center; color: #8b0000; margin: 20px 0;">
        बुध ग्रह का गोचर - 12 राशियों का फल 
        <span id="current-date" style="display: none;"></span>
    </h1>
    
    <!-- 12 राशियों के कार्ड यहाँ दिखेंगे -->
    <div id="rashifal-container" class="grid-container"></div>
</div>

<!-- 3. सही तारीख और टाइटल (घर) के साथ डेटा दिखाने वाली स्क्रिप्ट -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hour = String(now.getHours()).padStart(2, '0');
        const minute = String(now.getMinutes()).padStart(2, '0');

        const currentTimeStr = `${year}${month}${day}${hour}${minute}`;
        
        if (typeof budhData !== 'undefined') {
            const sortedKeys = Object.keys(budhData).sort();
            let activeKey = null;

            for (let key of sortedKeys) {
                let keyNumeric = key.replace(/-/g, '');
                if (keyNumeric <= currentTimeStr) {
                    activeKey = key;
                }
            }

            if (!activeKey && sortedKeys.length > 0) {
                activeKey = sortedKeys[sortedKeys.length - 1];
            }

            const rashifalData = budhData[activeKey];
            
            const dateElement = document.getElementById('current-date');
            if (dateElement) {
                dateElement.innerText = new Date().toLocaleDateString('hi-IN');
            }

            const container = document.getElementById('rashifal-container');
            if (container) {
                container.innerHTML = '';

                if (!rashifalData) {
                    container.innerHTML = "<h2 style='text-align:center;'>आज के लिए अभी कोई गोचर अपडेट नहीं है।</h2>";
                    return;
                }

                rashifalData.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const points = item.msg.split('.').filter(p => p.trim() !== "").map(p => `<li>${p.trim()}</li>`).join('');
                    
                    let upayHtml = item.upay ? `<p style="margin-top: 10px; color: #b22222; font-weight: bold;">💡 उपाय: ${item.upay}</p>` : '';

                    // यहाँ item.rashi की जगह item.title का उपयोग किया गया है ताकि "चौथा घर" या "पाँचवां घर" साथ में दिखे[span_4](start_span)[span_4](end_span)
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="rashi-icon">${item.icon}</span>
                            <h3>${item.title || item.rashi}</h3>
                        </div>
                        <ul class="analysis-list">${points}</ul>
                        ${upayHtml}
                    `;
                    container.appendChild(card);
                });
            }
        }
    });

    window.addEventListener('load', function() {
        if (typeof addDownloadButton === 'function') {
            addDownloadButton('capture-area', 'budh-rashifal.png');
        }
    });
</script>

</body>
</html>
